<!DOCTYPE html>

    <script>
      // Gracefully handle iframe WebSocket / HMR disconnection per environment constraints
      (function() {
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            try {
              const ws = new OriginalWebSocket(url, protocols);
              ws.addEventListener('error', function(e) {
                e.stopImmediatePropagation?.();
                e.stopPropagation?.();
              });
              return ws;
            } catch (err) {
              const stub = new EventTarget();
              return Object.assign(stub, {
                send: function() {},
                close: function() {},
                readyState: 3,
                addEventListener: stub.addEventListener.bind(stub),
                removeEventListener: stub.removeEventListener.bind(stub),
                dispatchEvent: stub.dispatchEvent.bind(stub),
              });
            }
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('error', function(event) {
          const msg = String(event.message || '');
          const file = String(event.filename || '');
          const stack = String(event.error?.stack || '');
          if (
            file.includes('@vite/client') ||
            msg.includes('WebSocket') ||
            msg.includes('ws') ||
            stack.includes('@vite/client')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          const reason = String(event.reason?.message || event.reason || '');
          if (
            reason.includes('WebSocket') ||
            reason.includes('@vite/client') ||
            reason.includes('vite:ws')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
